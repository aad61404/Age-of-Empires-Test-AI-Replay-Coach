[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoe2coach"
version = "0.1.0"
description = "AoE2 replay intelligence CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["mgz>=1.8", "pydantic>=2", "typer>=0.12"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aoe2coach = "aoe2coach.cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
