<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Replay Coach · 對局回顧</title>
<style>
:root{color-scheme:dark;--bg:#101411;--card:#1a201b;--line:#30392f;--muted:#9da99c;--gold:#e7c78b;--green:#a5c9aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf0e8;font-family:system-ui,-apple-system,sans-serif}header{border-bottom:1px solid var(--line);padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:750;letter-spacing:2px}.brand span{color:var(--gold)}.tag{color:var(--muted);font-size:12px;letter-spacing:2px}main{max-width:1200px;margin:auto;padding:48px 28px}h1{font-size:42px;margin:10px 0 16px;letter-spacing:-1px}p{color:var(--muted);line-height:1.7}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold)}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.badge{border:1px solid #536d52;padding:8px 14px;border-radius:30px;color:var(--green);white-space:nowrap;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}.label{font-size:12px;color:var(--muted);margin-bottom:12px}.value{font-size:27px;font-weight:600}.layout{display:grid;grid-template-columns:260px 1fr;gap:24px}h2{font-size:18px;margin:0 0 20px}button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold)}.player{width:100%;text-align:left;margin-bottom:10px;padding:18px;overflow-wrap:anywhere}.player.active{border-color:var(--gold);background:#2d3023}.player small{display:block;color:var(--muted);margin-top:8px}.note{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;line-height:1.8;color:var(--muted)}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input{flex:1;min-width:150px;cursor:text}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:12px;color:var(--muted)}.event{display:grid;grid-template-columns:85px 36px 1fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding:16px 0}.time{font-family:monospace;color:var(--gold);font-size:13px}.icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#303c2b;color:var(--green)}.event small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.event strong{font-size:14px;font-weight:550}.hint{background:#25271d;border:1px solid #484630;border-radius:9px;padding:12px 16px;color:#d4c6a5;font-size:12px;line-height:1.7;margin-bottom:20px}.pager{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:20px}button:disabled{opacity:.3;cursor:default}footer{font-size:11px;color:var(--muted);margin-top:28px;overflow-wrap:anywhere}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:760px){main{padding:28px 18px}.layout{grid-template-columns:1fr}.hero{display:block}h1{font-size:32px}.stats{gap:8px}.card{padding:16px}.value{font-size:21px}.badge{display:inline-block}.tag{display:none}.event{grid-template-columns:72px 30px 1fr;gap:8px}}
</style></head><body>
<header><div class="brand"><span>◈</span> REPLAY COACH</div><div class="tag">AGE OF EMPIRES II · MATCH REVIEW</div><span class="badge">LOCAL DEMO</span></header>
<main><div class="hero"><div><div class="eyebrow">每個決策，都有跡可循</div><h1>回看你的對局節奏</h1><p>從第一棟房屋到時代推進，沿著真實指令重新理解這場比賽。</p></div><span id="status" class="badge">載入錄影資料…</span></div>
<div class="stats"><div class="card"><div class="label">對戰地圖</div><div id="map" class="value">—</div></div><div class="card"><div class="label">錄影遊戲時間</div><div id="duration" class="value">—</div></div><div class="card"><div class="label">目前玩家指令</div><div id="total" class="value">—</div></div></div>
<div class="layout"><aside><h2>對局玩家</h2><div id="players"></div><div class="note">如何閱讀時間線<br>時間代表玩家下達指令的時刻，並非建築、單位或研究完成。這裡展示錄影事實，尚未提供 AI 評分。</div></aside><section class="card"><div class="sectionhead"><h2 style="margin:0">指令時間線</h2><span id="count" class="count"></span></div><div class="toolbar"><select id="filter" aria-label="事件類型"><option value="key">建造・生產・研究</option><option value="all">全部指令</option><option value="BUILD_COMMAND">建造指令</option><option value="QUEUE_COMMAND">生產佇列</option><option value="RESEARCH_COMMAND">研究指令</option><option value="RESIGN">投降</option></select><input id="search" type="search" placeholder="搜尋名稱，例如 House、Villager" aria-label="搜尋指令"></div><div id="warning" class="hint">正在讀取資料…</div><div id="events" aria-live="polite"></div><div class="pager"><button id="prev">← 上一頁</button><span id="page" class="count"></span><button id="next">下一頁 →</button></div></section></div><footer id="source"></footer></main>
<script>
const $=id=>document.getElementById(id), labels={BUILD_COMMAND:'建造指令',QUEUE_COMMAND:'加入生產佇列',RESEARCH_COMMAND:'研究指令',MOVE_COMMAND:'移動指令',TARGET_COMMAND:'目標指令',ATTACK_MOVE_COMMAND:'移動攻擊指令',RESIGN:'投降',OTHER:'其他指令',UNKNOWN:'未解碼指令',CHAT:'聊天'};let data,player,page=0;const size=30;const time=ms=>{let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function render(){const all=data.events.filter(e=>e.player_id===player).sort((a,b)=>a.time_ms-b.time_ms||a.offset-b.offset);$('total').textContent=all.length.toLocaleString();const q=$('search').value.toLowerCase(),f=$('filter').value;const rows=all.filter(e=>(f==='all'||f==='key'&&['BUILD_COMMAND','QUEUE_COMMAND','RESEARCH_COMMAND','RESIGN'].includes(e.kind)||e.kind===f)&&[e.entity_name,e.entity_id,e.raw_type,labels[e.kind]].join(' ').toLowerCase().includes(q));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages-1);$('count').textContent=`${rows.length} 筆符合條件`;$('events').replaceChildren();for(const e of rows.slice(page*size,(page+1)*size)){const row=document.createElement('div');row.className='event';const t=document.createElement('div');t.className='time';t.textContent=time(e.time_ms)+'.'+String(e.time_ms%1000).padStart(3,'0');const icon=document.createElement('div');icon.className='icon';icon.textContent=({BUILD_COMMAND:'⌂',QUEUE_COMMAND:'＋',RESEARCH_COMMAND:'◇'})[e.kind]||'·';const body=document.createElement('div'),title=document.createElement('strong'),sub=document.createElement('small');title.textContent=(labels[e.kind]||e.kind)+(e.entity_name?' · '+e.entity_name:e.entity_id!=null?' · ID '+e.entity_id:'');sub.textContent=e.raw_type+(e.entity_id!=null?' / ID '+e.entity_id:'');body.append(title,sub);row.append(t,icon,body);$('events').append(row)}if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='沒有符合條件的指令，試試其他分類或關鍵字。';$('events').append(empty)}$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;document.querySelectorAll('.player').forEach(b=>{b.classList.toggle('active',Number(b.dataset.id)===player);b.setAttribute('aria-pressed',String(Number(b.dataset.id)===player))})}
$('filter').onchange=$('search').oninput=()=>{page=0;if(data)render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};
fetch('replay.json').then(r=>{if(!r.ok)throw Error('找不到 Replay 資料，請先執行 build_demo.py。');return r.json()}).then(d=>{if(!d.match||!d.match.players.length)throw Error('缺少玩家資訊');data=d;player=d.match.players[0].id;$('map').textContent=d.match.map;$('duration').textContent=time(d.last_time_ms);$('status').textContent=d.status==='ok'?'● 解析成功':d.status==='partial'?'◐ 部分解析':'解析失敗';const unassigned=d.events.filter(e=>e.player_id==null).length;$('warning').textContent=`指令時間 ≠ 完成時間。${unassigned} 筆無玩家歸屬的事件未列入時間線。`+(d.status!=='ok'?' 部分資料未能解析，事件可能缺失。':'');for(const w of d.warnings||[]){const line=document.createElement('div');line.textContent=w;$('warning').append(line)}for(const p of d.match.players){const b=document.createElement('button');b.className='player';b.dataset.id=p.id;b.textContent=p.name;const c=document.createElement('small');c.textContent=p.civilization+' · 玩家 '+p.id;b.append(c);b.onclick=()=>{player=p.id;page=0;render()};$('players').append(b)}$('source').textContent=`來源：${d.source.file} · mgz ${d.parser.package_version} · Save ${d.parser.save_version} · 名稱資料 aocref ${d.parser.reference_version||'—'} · 僅供本機回顧`;render()}).catch(e=>{$('status').textContent='載入失敗';$('warning').textContent=e.message;$('prev').disabled=$('next').disabled=true});
</script></body></html>
